[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-morphometry"
version = "0.1.0"
description = "Herramienta de medición morfométrica para los métodos A, A′, B y C"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Equipo Fish Morphometry" },
]
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
fish-morphometry = "fish_morphometry.app:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/fish_morphometry"]
omit = [
  "src/fish_morphometry/ui/*",
  "src/fish_morphometry/app.py",
  # Estos caminos ejecutan adquisición/calibración física con imágenes reales;
  # se prueban sus contratos de perfiles, pero no se fuerza cobertura artificial
  # sobre las ramas de OpenCV que requieren un tablero capturado.
  "src/fish_morphometry/calibration/air_calibration.py",
  "src/fish_morphometry/calibration/b_calibration.py",
  "src/fish_morphometry/geometry/rail_plane.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
fail_under = 70
