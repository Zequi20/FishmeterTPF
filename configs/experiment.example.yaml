# Configuración de ejemplo para A y A′. Los valores físicos deben verificarse con
# mediciones del montaje real antes de usarlos en un experimento.
experiment:
  name: "A_A_prime_pilot"
  units: "mm"

aruco:
  dictionary: "DICT_4X4_50"
  method_a:
    id: 10
    side_mm: 30.0  # Sustituya por la medida real con calibre.
    role: "glass"
    plane: "glass_inner_surface"
  method_a_prime:
    id: 11
    side_mm: 30.0  # Sustituya por la medida real con calibre.
    role: "coplanar"
    plane: "replica_symmetry_plane"
    coplanarity_error_mm: 0.0  # Registre aquí la medición física real.

measurements:
  use_same_points_for_all_methods: true
  # Dirección del eje cabeza→cola en coordenadas de imagen (Y crece hacia abajo).
  # (1, 0) solo es válido si el montaje verifica que el pez está horizontal.
  longitudinal_axis_px: [1.0, 0.0]
  # Umbral operativo configurable; debe justificarse según el error experimental.
  maximum_depth_section_angle_degrees: 5.0
  total_length:
    start: "p1"
    end: "p2"
  body_depth:
    start: "p3"
    end: "p4"

quality:
  minimum_marker_side_px: 30
  maximum_side_cv: 0.10

# Método B se configura desde la pantalla o sus APIs, después de aportar datos
# físicos del montaje. No se rellenan valores ficticios en este ejemplo:
# method_b:
#   calibration_profile: null       # YAML nativo B o calibration.yaml de Calibmar pinhole.
#   calibration_quality:
#     maximum_per_view_error_px: 1.5
#     minimum_center_span_fraction: 0.20
#     minimum_tilt_span_degrees: 10.0
#   rail_reference: null            # Ajuste solvePnP con >=2 posiciones que abarquen z_ref_mm.
#   z_ref_mm: null                  # Posición real de la zona más cercana al vidrio.
#   rail_reference_quality:
#     maximum_reprojection_error_px: 1.0
#     maximum_rail_fit_residual_mm: 1.0
#     maximum_normal_spread_degrees: 1.0
#   replica_plane_offset_mm: null   # Medición física firmada respecto del tablero.
#   replica_plane_offset_direction: "rail"  # Alternativa explícita: "plane_normal".
#   longitudinal_axis_px: [1.0, 0.0]
#   maximum_depth_section_angle_degrees: 5.0
#   physical_validation:
#     maximum_absolute_error_mm: null
#     maximum_percentage_error: 1.0

# Método C se configura desde la pestaña C o sus APIs. Declare explícitamente
# las unidades y complete únicamente con mediciones del montaje real:
# method_c:
#   air_calibration_profile: null  # Perfil nativo air_calibration.v1 o Calibmar FLATPORT.
#   flat_port_yaml: null           # flat_port.units debe ser "mm".
#   measurement_plane_yaml: null   # Marco physical_camera_refractive; no reutilizar pose efectiva B.
#   interface_distance_mm: null    # Centro de proyección → primera interfaz.
#   glass_thickness_mm: null
#   n_air: 1.000
#   n_glass: null
#   n_water: null                  # Depende de temperatura/salinidad.
#   water_temperature_c: null
#   water_salinity_ppt: null
#   water_pressure_dbar: null
#   longitudinal_axis_px: [1.0, 0.0]
#   maximum_depth_section_angle_degrees: 5.0
#   physical_validation:
#     maximum_absolute_error_mm: null
#     maximum_percentage_error: 1.0

paths:
  images: null  # Ruta opcional a las imágenes del ensayo.
  annotations: null  # Ruta futura para puntos anatómicos.
